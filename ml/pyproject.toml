[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foxcat-medical-ml"
version = "1.0.0"
description = "Medical risk prediction and model training pipeline for FoxCat Medical Dashboard"
requires-python = ">=3.10,<3.14"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "joblib>=1.3,<2",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "xgboost>=2.0,<4",
    "lightgbm>=4.0,<5",
    "catboost>=1.2,<2",
]

[project.optional-dependencies]
diagnostics = [
    "shap>=0.45,<1",
]

dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
foxcat-train = "train:main"

[tool.setuptools]
py-modules = [
    "train",
    "run_training",
    "config",
    "utils",
    "algorithms",
    "algorithm_common",
    "model_common",
    "model_publisher",
    "model_runtime",
    "risk_projection",
    "export_iterations",
    "diagnostics",
    "clinical_features",
    "target_features",
    "data_preparation",
    "audit_dataset",
    "train_xgboost",
    "train_lightgbm",
    "train_catboost",
    "train_random_forest",
    "train_extra_trees",
    "train_svm",
    "train_logistic_regression",
    "train_deep_learning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"train.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true

